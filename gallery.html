<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Lingua Azur</title>
  <link rel="stylesheet" href="css/output.css">
  <script src="js/theme.js"></script>
</head>
<body class="bg-sky-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100">
  <header>
    <nav class="flex items-center justify-between p-4 bg-white dark:bg-slate-800">
      <a class="hover:text-sky-700 dark:hover:text-sky-300" href="index.html">Lingua Azur</a>
      <div class="flex items-center gap-6">
        <a class="hover:text-sky-700 dark:hover:text-sky-300" href="index.html">Home</a>
        <a class="hover:text-sky-700 dark:hover:text-sky-300" href="courses.html">Courses</a>
        <a class="hover:text-sky-700 dark:hover:text-sky-300" href="gallery.html">Gallery</a>
        <a class="hover:text-sky-700 dark:hover:text-sky-300" href="contact.html">Contact</a>
        <button id="theme-toggle" type="button"
                aria-label="Switch between light and dark mode"
                class="rounded-lg border border-slate-300 px-3 py-1 text-sm hover:bg-sky-100 focus:outline-none focus:ring-2 focus:ring-sky-400 dark:border-slate-600 dark:hover:bg-slate-700">
          <span class="dark:hidden">🌙 Dark</span>
          <span class="hidden dark:inline">☀️ Light</span>
        </button>
      </div>
    </nav>
  </header>

  <main>
    <section class="py-16 px-6 text-center">
      <h1 class="text-4xl font-bold text-sky-900 dark:text-white">Life at Lingua Azur</h1>
      <p class="mt-4 max-w-xl mx-auto text-slate-600 dark:text-slate-300">A look inside our classes, our city and the way we learn together.</p>
    </section>

    <section class="px-6 pb-16">
      <div class="grid gap-4 md:gap-6 sm:grid-cols-2 lg:grid-cols-3 max-w-6xl mx-auto">

        <figure class="group relative aspect-video lg:aspect-auto sm:col-span-2 lg:row-span-2 overflow-hidden rounded-2xl border-4 border-white shadow-lg dark:border-slate-700">
          <img src="images/terrace-class.jpg" width="1376" height="768"
               alt="Students and a teacher sitting at outdoor tables on a terrace by the sea in Nice during a French lesson"
               class="h-full w-full object-cover transition duration-500 group-hover:scale-105">
          <figcaption class="absolute inset-x-0 bottom-0 bg-linear-to-t from-black/70 to-transparent p-4 text-sm font-medium text-white">Lessons by the sea</figcaption>
        </figure>

        <figure class="group relative aspect-video overflow-hidden rounded-2xl border-4 border-white shadow-lg dark:border-slate-700">
          <img src="images/classroom.jpg" width="1376" height="768" loading="lazy"
               alt="A teacher speaking to a small group of adult students sitting at desks in a bright classroom with a whiteboard"
               class="h-full w-full object-cover transition duration-500 group-hover:scale-105">
          <figcaption class="absolute inset-x-0 bottom-0 bg-linear-to-t from-black/70 to-transparent p-4 text-sm font-medium text-white">Our classroom</figcaption>
        </figure>

        <figure class="group relative aspect-video overflow-hidden rounded-2xl border-4 border-white shadow-lg dark:border-slate-700">
          <img src="images/teacher.jpg" width="1376" height="768" loading="lazy"
               alt="A teacher writing greetings in several languages on a whiteboard while students take notes on laptops"
               class="h-full w-full object-cover transition duration-500 group-hover:scale-105">
          <figcaption class="absolute inset-x-0 bottom-0 bg-linear-to-t from-black/70 to-transparent p-4 text-sm font-medium text-white">Hello in every language</figcaption>
        </figure>

        <figure class="group relative aspect-video overflow-hidden rounded-2xl border-4 border-white shadow-lg dark:border-slate-700">
          <img src="images/conversation.jpg" width="1376" height="768" loading="lazy"
               alt="Two students laughing as they practise conversation over coffee at a café table on the street"
               class="h-full w-full object-cover transition duration-500 group-hover:scale-105">
          <figcaption class="absolute inset-x-0 bottom-0 bg-linear-to-t from-black/70 to-transparent p-4 text-sm font-medium text-white">Practice over coffee</figcaption>
        </figure>

        <figure class="group relative aspect-video overflow-hidden rounded-2xl border-4 border-white shadow-lg dark:border-slate-700">
          <img src="images/nice-street.jpg" width="1376" height="768" loading="lazy"
               alt="A busy market street in Nice with colourful buildings, fruit stalls and bunches of sunflowers"
               class="h-full w-full object-cover transition duration-500 group-hover:scale-105">
          <figcaption class="absolute inset-x-0 bottom-0 bg-linear-to-t from-black/70 to-transparent p-4 text-sm font-medium text-white">Learning from real life in Nice</figcaption>
        </figure>

        <figure class="group relative aspect-video overflow-hidden rounded-2xl border-4 border-white shadow-lg dark:border-slate-700">
          <img src="images/books.jpg" width="1376" height="768" loading="lazy"
               alt="A wooden table covered with language books, notebooks and a cup of coffee"
               class="h-full w-full object-cover transition duration-500 group-hover:scale-105">
          <figcaption class="absolute inset-x-0 bottom-0 bg-linear-to-t from-black/70 to-transparent p-4 text-sm font-medium text-white">Books and notes</figcaption>
        </figure>

      </div>
    </section>
  </main>

  <footer class="bg-slate-800 py-8 px-6 text-center text-slate-200 dark:bg-slate-950">
    <p>Lingua Azur · 12 Rue de la République, 06000 Nice · +33 4 93 00 00 00</p>
    <p class="mt-2 text-sm text-slate-400">© 2026 Lingua Azur. All rights reserved.</p>
  </footer>
</body>
</html>
